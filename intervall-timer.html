<title>Intervall-Timer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: eine Gym-Uhr auf einem Bildschirm – Phase, riesige Ziffern, Rundenpunkte, Steuerung; Einstellungen darunter */
:root {
  --bg: #f1efeb; --surface: #ffffff; --fg: #1d1b19; --muted: #6b665f; --line: #dcd6cf;
  --work: #cf4318; --rest: #1a8070; --prep: #a87a06; --done: #3550c8;
  --display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141312; --surface: #1f1d1b; --fg: #f2eee9; --muted: #a29b93; --line: #35312d;
    --work: #ff6b3d; --rest: #3cc4ad; --prep: #e2b43c; --done: #8199ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141312; --surface: #1f1d1b; --fg: #f2eee9; --muted: #a29b93; --line: #35312d;
  --work: #ff6b3d; --rest: #3cc4ad; --prep: #e2b43c; --done: #8199ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: .02em; text-transform: uppercase; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--phase, var(--work)); outline-offset: 2px; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; color: var(--muted); }
.ghost[aria-pressed="false"] { text-decoration: line-through; }

.clock {
  --phase: var(--muted);
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 22px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  position: relative; overflow: hidden;
}
.clock[data-phase="work"] { --phase: var(--work); }
.clock[data-phase="rest"] { --phase: var(--rest); }
.clock[data-phase="prep"] { --phase: var(--prep); }
.clock[data-phase="done"] { --phase: var(--done); }
.clock::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; background: var(--phase); }
.phase {
  font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--phase); transition: color .2s;
}
.time {
  font-family: var(--display); font-weight: 800; line-height: .9; font-variant-numeric: tabular-nums;
  font-size: clamp(110px, 34vw, 190px); letter-spacing: -.01em; color: var(--fg);
}
.clock.blink .time { animation: blink .5s steps(1) 2; }
@keyframes blink { 50% { color: var(--phase); } }
.bar { width: 100%; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--phase); border-radius: inherit; }
.round { font-weight: 600; font-size: 17px; color: var(--muted); font-variant-numeric: tabular-nums; }
.round b { color: var(--fg); }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 100%; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); }
.dots i.done { background: var(--work); border-color: var(--work); }
.dots i.now { border-color: var(--phase); }

.controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; }
.controls button { border-radius: 14px; padding: 14px 8px; font-weight: 600; font-size: 16px; border: 1px solid var(--line); background: var(--surface); }
.controls button:disabled { opacity: .4; cursor: default; }
#start { background: var(--fg); color: var(--bg); border-color: var(--fg); font-family: var(--display); font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding-block: 10px; }

.settings { display: flex; flex-direction: column; gap: 14px; }
.settings h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets button { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; }
.presets button:disabled, .step button:disabled { opacity: .4; cursor: default; }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; }
.row + .row { border-top: 1px solid var(--line); }
.row label { font-weight: 600; }
.row small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.row .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.step { display: flex; align-items: center; gap: 6px; }
.step button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 22px; line-height: 1; }
.step output { min-width: 64px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.total { color: var(--muted); font-size: 14px; text-align: right; }
.total b { color: var(--fg); font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
@media (prefers-reduced-motion: reduce) { .clock.blink .time { animation: none; } .phase { transition: none; } }
</style>

<main class="app">
  <header>
    <h1>Intervall-Timer</h1>
    <button id="sound" class="ghost" type="button" aria-pressed="true">Ton an</button>
  </header>

  <section class="clock" id="clock" data-phase="idle" aria-live="polite">
    <div class="phase" id="phase">Bereit</div>
    <div class="time" id="time">0:45</div>
    <div class="bar"><span id="bar"></span></div>
    <div class="round" id="round">8 Runden</div>
    <div class="dots" id="dots"></div>
  </section>

  <div class="controls">
    <button id="reset" type="button">Zurück&shy;setzen</button>
    <button id="start" type="button">Start</button>
    <button id="skip" type="button" disabled>Weiter</button>
  </div>

  <section class="settings" id="settings">
    <h2>Einstellungen</h2>
    <div class="presets">
      <button type="button" data-preset="20,10,8,10">Tabata 20/10 × 8</button>
      <button type="button" data-preset="45,15,10,10">45/15 × 10</button>
      <button type="button" data-preset="60,30,6,10">60/30 × 6</button>
      <button type="button" data-preset="180,60,3,10">Boxen 3 Min × 3</button>
    </div>
    <div class="rows">
      <div class="row">
        <label for="v-work"><span class="dot" style="background:var(--work)"></span>Trainingszeit<small>pro Runde</small></label>
        <div class="step" data-key="work"><button type="button" data-d="-1" aria-label="Trainingszeit verringern">−</button><output id="v-work"></output><button type="button" data-d="1" aria-label="Trainingszeit erhöhen">+</button></div>
      </div>
      <div class="row">
        <label for="v-rest"><span class="dot" style="background:var(--rest)"></span>Pause<small>zwischen den Runden</small></label>
        <div class="step" data-key="rest"><button type="button" data-d="-1" aria-label="Pause verringern">−</button><output id="v-rest"></output><button type="button" data-d="1" aria-label="Pause erhöhen">+</button></div>
      </div>
      <div class="row">
        <label for="v-rounds"><span class="dot" style="background:var(--fg)"></span>Runden<small>Wiederholungen</small></label>
        <div class="step" data-key="rounds"><button type="button" data-d="-1" aria-label="Runden verringern">−</button><output id="v-rounds"></output><button type="button" data-d="1" aria-label="Runden erhöhen">+</button></div>
      </div>
      <div class="row">
        <label for="v-prep"><span class="dot" style="background:var(--prep)"></span>Vorbereitung<small>Countdown vor Runde 1</small></label>
        <div class="step" data-key="prep"><button type="button" data-d="-1" aria-label="Vorbereitung verringern">−</button><output id="v-prep"></output><button type="button" data-d="1" aria-label="Vorbereitung erhöhen">+</button></div>
      </div>
    </div>
    <div class="total">Gesamtdauer <b id="total">0:00</b></div>
    <p class="hint">Töne: kurze Pieptöne bei 3 – 2 – 1, ein hoher Ton wenn das Training startet, ein tiefer Ton bei der Pause, drei Töne am Ende. Leertaste = Start/Pause.</p>
  </section>
</main>

<script>
(() => {
  const LIMITS = {
    work:   { min: 5, max: 3600, step: 5, time: true },
    rest:   { min: 0, max: 3600, step: 5, time: true },
    rounds: { min: 1, max: 99,   step: 1, time: false },
    prep:   { min: 0, max: 60,   step: 5, time: true },
  };
  const LABEL = { prep: "Vorbereitung", work: "Training", rest: "Pause", done: "Fertig!", idle: "Bereit" };
  const $ = (id) => document.getElementById(id);

  let cfg = { work: 45, rest: 15, rounds: 8, prep: 10 };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem("intervall-cfg") || "{}")); } catch (e) {}
  let soundOn = true;
  try { soundOn = localStorage.getItem("intervall-sound") !== "off"; } catch (e) {}

  let state = "idle";          // idle | running | paused | done
  let phases = [], idx = 0, endAt = 0, leftMs = 0, lastSec = null, timer = null, wakeLock = null;

  const fmt = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  // ---------- Ton ----------
  let ac = null;
  function audio() {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function beep(freq, dur, delay = 0, vol = 0.5) {
    if (!soundOn) return;
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.01);
    g.gain.setValueAtTime(vol * 0.35, t + dur - 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const sounds = {
    tick: () => beep(880, 0.12),
    work: () => beep(1320, 0.6, 0, 0.7),
    rest: () => beep(520, 0.6, 0, 0.7),
    done: () => { beep(1046, 0.25, 0, 0.7); beep(1318, 0.25, 0.32, 0.7); beep(1568, 0.7, 0.64, 0.7); },
  };

  // ---------- Wake Lock (Bildschirm bleibt an) ----------
  async function lockScreen() { try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {} }
  function unlockScreen() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && state === "running") lockScreen(); });

  // ---------- Ablauf ----------
  function buildPhases() {
    const p = [];
    if (cfg.prep > 0) p.push({ type: "prep", dur: cfg.prep, round: 1 });
    for (let r = 1; r <= cfg.rounds; r++) {
      p.push({ type: "work", dur: cfg.work, round: r });
      if (r < cfg.rounds && cfg.rest > 0) p.push({ type: "rest", dur: cfg.rest, round: r });
    }
    return p;
  }
  function enter(i) {
    idx = i;
    if (idx >= phases.length) return finish();
    const ph = phases[idx];
    endAt = performance.now() + ph.dur * 1000;
    lastSec = Math.ceil(ph.dur);
    if (ph.type === "work") sounds.work();
    else if (ph.type === "rest") sounds.rest();
    flash();
    render();
  }
  function finish() {
    state = "done"; clearInterval(timer); timer = null; unlockScreen();
    sounds.done(); flash(); render();
  }
  function tick() {
    if (state !== "running") return;
    const left = (endAt - performance.now()) / 1000;
    if (left <= 0) { enter(idx + 1); return; }
    const sec = Math.ceil(left);
    if (sec !== lastSec) { lastSec = sec; if (sec <= 3 && sec >= 1) sounds.tick(); }
    render(left);
  }
  function start() {
    audio();
    if (state === "idle" || state === "done") {
      phases = buildPhases(); state = "running"; enter(0);
    } else if (state === "paused") {
      endAt = performance.now() + leftMs; state = "running";
    }
    clearInterval(timer); timer = setInterval(tick, 100);
    lockScreen(); render();
  }
  function pause() {
    leftMs = endAt - performance.now(); state = "paused";
    clearInterval(timer); timer = null; unlockScreen(); render(leftMs / 1000);
  }
  function reset() { state = "idle"; clearInterval(timer); timer = null; unlockScreen(); phases = []; idx = 0; render(); }
  function skip() {
    if (state === "running") enter(idx + 1);
    else if (state === "paused") { enter(idx + 1); if (state === "paused" || state === "running") { state = "paused"; leftMs = phases[idx].dur * 1000; render(phases[idx].dur); } }
  }
  function flash() { const c = $("clock"); c.classList.remove("blink"); void c.offsetWidth; c.classList.add("blink"); }

  // ---------- Anzeige ----------
  function render(left) {
    const clock = $("clock"), active = state === "running" || state === "paused";
    const ph = active ? phases[idx] : null;
    const type = state === "done" ? "done" : ph ? ph.type : "idle";
    clock.dataset.phase = type;
    $("phase").textContent = state === "paused" ? LABEL[type] + " · pausiert" : LABEL[type];

    if (ph) {
      const l = left ?? ph.dur;
      $("time").textContent = fmt(l);
      $("bar").style.width = (100 * (1 - l / ph.dur)).toFixed(2) + "%";
      $("round").innerHTML = "Runde <b>" + ph.round + "</b> von " + cfg.rounds;
    } else {
      $("time").textContent = state === "done" ? "0:00" : fmt(cfg.work);
      $("bar").style.width = state === "done" ? "100%" : "0%";
      $("round").innerHTML = state === "done" ? "<b>" + cfg.rounds + "</b> Runden geschafft" : "<b>" + cfg.rounds + "</b> " + (cfg.rounds === 1 ? "Runde" : "Runden");
    }

    const dots = $("dots");
    if (dots.children.length !== cfg.rounds) dots.innerHTML = "<i></i>".repeat(cfg.rounds);
    [...dots.children].forEach((d, i) => {
      const r = i + 1;
      const done = state === "done" || (ph && (r < ph.round || (r === ph.round && ph.type === "rest")));
      d.className = done ? "done" : ph && r === ph.round && ph.type !== "rest" ? "now" : "";
    });

    $("start").textContent = state === "running" ? "Pause" : state === "paused" ? "Weiter" : state === "done" ? "Nochmal" : "Start";
    $("skip").disabled = !active;
    $("skip").textContent = "Überspringen";
    document.querySelectorAll(".settings button").forEach((b) => (b.disabled = active));
  }
  function renderSettings() {
    for (const k in LIMITS) $("v-" + k).textContent = LIMITS[k].time ? fmt(cfg[k]) : cfg[k];
    const total = cfg.prep + cfg.rounds * cfg.work + (cfg.rounds - 1) * cfg.rest;
    $("total").textContent = fmt(total);
    try { localStorage.setItem("intervall-cfg", JSON.stringify(cfg)); } catch (e) {}
    if (state === "idle" || state === "done") { state = "idle"; render(); }
  }
  function stepValue(k, dir) {
    const L = LIMITS[k]; let v = cfg[k];
    // Feinere Schritte unter 30 s, gröbere über 2 Min.
    let s = L.step;
    if (L.time) s = v + (dir > 0 ? 0 : -1) < 30 ? 5 : v + (dir > 0 ? 0 : -1) < 120 ? 10 : 30;
    if (L.time && k !== "work" && k !== "prep" && v + dir * s < 0) s = v;
    cfg[k] = Math.min(L.max, Math.max(L.min, v + dir * s));
    renderSettings();
  }

  // ---------- Events ----------
  $("start").addEventListener("click", () => (state === "running" ? pause() : start()));
  $("reset").addEventListener("click", reset);
  $("skip").addEventListener("click", skip);
  $("sound").addEventListener("click", (e) => {
    soundOn = !soundOn;
    e.currentTarget.setAttribute("aria-pressed", soundOn);
    e.currentTarget.textContent = soundOn ? "Ton an" : "Ton aus";
    try { localStorage.setItem("intervall-sound", soundOn ? "on" : "off"); } catch (er) {}
    if (soundOn) sounds.tick();
  });
  document.querySelectorAll(".step").forEach((el) =>
    el.querySelectorAll("button").forEach((b) => {
      let hold = null;
      const go = () => stepValue(el.dataset.key, +b.dataset.d);
      b.addEventListener("click", go);
      b.addEventListener("pointerdown", () => { hold = setTimeout(function rep() { go(); hold = setTimeout(rep, 90); }, 450); });
      ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => b.addEventListener(ev, () => clearTimeout(hold)));
    })
  );
  document.querySelectorAll("[data-preset]").forEach((b) =>
    b.addEventListener("click", () => {
      const [work, rest, rounds, prep] = b.dataset.preset.split(",").map(Number);
      cfg = { work, rest, rounds, prep }; renderSettings();
    })
  );
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); state === "running" ? pause() : start(); }
  });

  $("sound").setAttribute("aria-pressed", soundOn);
  $("sound").textContent = soundOn ? "Ton an" : "Ton aus";
  renderSettings();
  render();
})();
</script>
